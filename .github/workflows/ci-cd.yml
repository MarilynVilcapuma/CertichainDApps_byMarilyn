# ---------------------------------------------------------------
# CI/CD de CertiChain Perú (GitHub Actions)
#   compilar → comprueba que la DApp compila (también en pull requests)
#   docker   → construye la imagen y la sube a Docker Hub
#
# develop → imagen :develop
# main    → imagen :latest
#
# El despliegue en la nube lo hace Railway, que construye el Dockerfile
# directamente desde el repositorio de GitHub.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   token de acceso de Docker Hub (no la contraseña)
#   VITE_ETHERSCAN_KEY                    clave de Etherscan para compilar
# Nunca escribas estos valores en el repositorio.
# ---------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Un despliegue nuevo cancela el anterior de la misma rama
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ETHERSCAN_KEY: ${{ secrets.VITE_ETHERSCAN_KEY }}

  docker:
    name: Imagen en Docker Hub
    needs: compilar
    # Los pull requests solo compilan: no publican imágenes ni usan secretos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_ETHERSCAN_KEY=${{ secrets.VITE_ETHERSCAN_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/certichain:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/certichain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
