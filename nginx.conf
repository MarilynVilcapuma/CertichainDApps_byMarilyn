server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas. nginx no las hereda en un location que define
    # su propio add_header, por eso se repiten en los de abajo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprobación de salud para el servicio cloud y para HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Archivos con hash en el nombre: se pueden cachear un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un despliegue nuevo se vea de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # La DApp usa rutas con # (hash), pero si alguien abre una ruta directa
    # se devuelve index.html en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
